<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="ADA.png" type="text" size="16x16 32x32">
    <title>Set Up Your Paths — ADA Community</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/roadmap.css">
</head>

<body class="roadmap-page">

    <main class="roadmap-wrapper">

        <!-- PAGE HEADER -->
        <header class="roadmap-header">
            <div class="roadmap-brand">
                <h2>ADA<span>COMMUNITY</span></h2>
            </div>
            <h1 class="roadmap-title" id="roadmapTitle">Let's set up your paths</h1>
            <p class="roadmap-subtitle" id="roadmapSubtitle">
                Pick up to 2 AI tools and up to 2 niches. You can change these later.
            </p>
        </header>


        <!-- SECTION: AI TOOLS -->
        <section class="roadmap-section" data-section="tools">

            <header class="section-header">
                <h3 class="section-title">Choose Your AI Tools</h3>
                <span class="section-counter" id="toolsCounter" aria-live="polite">0 / 2 selected</span>
            </header>

            <div class="option-grid" id="toolsGrid">

                <button class="option-btn" type="button" data-value="ChatGPT 4.0">ChatGPT 4.0</button>
                <button class="option-btn" type="button" data-value="Claude AI">Claude AI</button>
                <button class="option-btn" type="button" data-value="Gemini AI">Gemini AI</button>
                <button class="option-btn" type="button" data-value="Kimi AI 2.6">Kimi AI 2.6</button>

                <button class="option-btn extra" type="button" data-value="DeepSeek">DeepSeek</button>
                <button class="option-btn extra" type="button" data-value="Grok AI">Grok AI</button>
                <button class="option-btn extra" type="button" data-value="Meta AI">Meta AI</button>

            </div>

            <button class="see-more-btn" type="button" id="toolsSeeMore" data-target="toolsGrid">
                See 3 more tools
            </button>

        </section>


        <!-- SECTION: NICHE PATHS -->
        <!-- SECTION: NICHE PATHS -->
        <section class="roadmap-section" data-section="niches">

            <header class="section-header">
                <h3 class="section-title">Choose Your Niche Paths</h3>
                <span class="section-counter" id="nichesCounter" aria-live="polite">0 / 2 selected</span>
            </header>

            <div class="option-grid" id="nichesGrid">

                <button class="option-btn" type="button" data-value="AI Engineer">AI Engineer</button>
                <button class="option-btn" type="button" data-value="Cloud Engineer">Cloud Engineer</button>
                <button class="option-btn" type="button" data-value="UI/UX Engineer">UI/UX Engineer</button>
                <button class="option-btn" type="button" data-value="Web Engineer">Web Engineer</button>
                <button class="option-btn" type="button" data-value="Web-App Engineer">Web-App Engineer</button>
                <button class="option-btn" type="button" data-value="Network Engineer">Network Engineer</button>

                <button class="option-btn extra" type="button" data-value="Cyber Security">Cyber Security</button>
                <button class="option-btn extra" type="button" data-value="Self Employed">Self Employed</button>
                <button class="option-btn extra" type="button" data-value="Community Manager">Community Manager</button>
                <button class="option-btn extra" type="button" data-value="Project Manager">Project Manager</button>
                <button class="option-btn extra" type="button" data-value="Trader / Business Owner">Trader / Business
                    Owner</button>
                <button class="option-btn extra" type="button" data-value="Coach / Teacher">Coach / Teacher</button>
                <button class="option-btn extra" type="button" data-value="Musician">Musician</button>

            </div>

            <button class="see-more-btn" type="button" id="nichesSeeMore" data-target="nichesGrid">
                See 7 more niches
            </button>

        </section>


        <!-- TOAST — appears when user tries to pick a 3rd option -->
        <div class="roadmap-toast" id="roadmapToast" role="status" aria-live="polite"></div>


        <!-- FOOTER -->
        <footer class="roadmap-footer">

            <p class="roadmap-hint" id="roadmapHint">
                Pick at least 1 tool and 1 niche to continue
            </p>

            <button class="roadmap-submit" id="roadmapSubmit" type="button" disabled>
                Save Changes
            </button>

        </footer>

    </main>


    <script src="js/auth.js"></script>
    <script src="js/roadmap.js"></script>

</body>

</html>
