<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="icon" href="ADA.png" type="text" size="16x16 32x32">
    <title>ADA AI — ADA Community</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/chatbox.css">
</head>
<body class="chatbox-page">


    <!-- MAIN COLUMN -->
    <div class="chatbox-main">

        <!-- TOP BAR -->
        <header class="chatbox-topbar">

            <button class="chatbox-menu-btn" id="chatboxMenuBtn"
                    type="button"
                    aria-label="Open conversations"
                    aria-expanded="false"
                    aria-controls="chatboxDrawer">
                <span class="chatbox-hamburger-line"></span>
                <span class="chatbox-hamburger-line"></span>
                <span class="chatbox-hamburger-line"></span>
            </button>

            <h2 class="chatbox-brand">ADA<span>COMMUNITY</span></h2>

            <a href="dashboard.html" class="chatbox-avatar" id="chatboxAvatar"
               aria-label="Back to dashboard">
                ··
            </a>

        </header>


        <!-- CHAT AREA -->
        <main class="chat-area" id="chatArea">
            <!-- Rendered by chatbox.js -->
        </main>


        <!-- COMPOSER -->
        <div class="composer-section">

            <div class="composer-box">

                <textarea class="composer-input" id="composerInput"
                          rows="1"
                          placeholder="Message ADA..."
                          aria-label="Message ADA"></textarea>

                <button class="composer-send" id="composerSend"
                        type="button"
                        aria-label="Send message"
                        disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20"
                         fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>

            </div>

            <p class="composer-disclaimer">
                ADA may make mistakes. Verify important information.
            </p>

        </div>

    </div>


    <!-- OVERLAY -->
    <div class="chatbox-overlay" id="chatboxOverlay"></div>


    <!-- DRAWER — CONVERSATION HISTORY -->
    <aside class="chatbox-drawer" id="chatboxDrawer"
           aria-label="Conversations menu">

        <header class="drawer-header">
            <h2 class="drawer-brand">ADA<span>COMMUNITY</span></h2>
            <button class="drawer-close" id="chatboxDrawerClose"
                    type="button" aria-label="Close menu">
                <span></span>
                <span></span>
            </button>
        </header>

        <div class="drawer-body">

            <button class="new-chat-btn" id="newChatBtn" type="button">
                <span aria-hidden="true">＋</span>
                <span>New Chat</span>
            </button>

            <p class="drawer-section-label">Recent Conversations</p>

            <div class="conversation-list" id="conversationList">
                <!-- Rendered by chatbox.js -->
            </div>

        </div>

    </aside>


    <!-- SCRIPTS -->
    <script src="js/auth.js"></script>
    <script src="js/chatbox.js"></script>

</body>
</html>
