<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="icon" href="ADA.png" type="text" size="16x16 32x32">
    <title>Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-content" id="formContent">
            <h3>Sign In <span><a href="signin.html">Sign Up</a></span></h3>
            <form action="">
                <input type="Email" placeholder="Email">
                <input type="Password"  placeholder="Password">
            </form>

            <div class="check-box" id="checkBox">
                <input type="checkbox"><span>I agree with the</span><a href="">Terms & Conditions</a>
            </div>
            <div class="form-button" id="form-button">
                <button><a href="login.html">Sign In</a></button>
            </div>

            <div class="account-link" id="accountLink">
                <h4>Don't have an Account?</h4><a href="signin.html">Sign Up</a>
            </div>
        </div>

        <div class="form-circle" id="formCircle">
            <div class="circle" id="circle"></div>
            <div class="circle" id="circle"></div>
            <div class="circle" id="circle"></div>
        </div>
    </div>

    <div class="navbranding" id="navBranding">
            <h2 id="logo">ADA<span>COMMUNITY</span></h2>
    </div>

    
    
</body>
</html>
